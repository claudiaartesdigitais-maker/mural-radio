<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { margin: 0; padding: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
    .header { background: #001a33; color: #ffcc00; text-align: center; padding: 10px; border-bottom: 3px solid #ffcc00; }
    .title { font-weight: bold; font-size: 16px; text-transform: uppercase; }
    /* Ajuste de altura para não cortar embaixo */
    .swiper { width: 100%; height: 350px; margin-top: 10px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; }
    /* Ajuste do card */
    .card { width: 280px; height: 330px; background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; }
    /* Ajuste para a imagem NÃO cortar (contain) */
    img, video { width: 100%; height: 100%; object-fit: contain; }
    .btn-link { position: absolute; bottom: 15px; right: 15px; background: #ffcc00; color: #001a33; padding: 8px 12px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header"><div class="title">Mural da Comunidade</div></div>
  <div class="swiper"><div class="swiper-wrapper" id="track"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const linkDaPlanilha = "https://script.google.com/macros/s/AKfycbxdgXRUsVRZWk_IkQeTua6h3pdZ08P4nFTD6GHj_wHv3xKhJpuqCE1E1rEG26XRM1p4fA/exec";

    async function carregar() {
      try {
        const res = await fetch(linkDaPlanilha);
        const dados = await res.json();
        const container = document.getElementById("track");

        container.innerHTML = dados.map(item => {
          const isVideo = item.arquivo.includes('.mp4');
          // Adicionei 'controls' para você conseguir dar play no som
          const midia = isVideo 
            ? `<video src="${item.arquivo}" autoplay muted loop playsinline controls></video>` 
            : `<img src="${item.arquivo}">`;
          
          return `
            <div class="swiper-slide">
              <div class="card">
                ${midia}
                ${item.link ? `<a href="${item.link}" target="_blank" class="btn-link">VER MAIS</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', { slidesPerView: 'auto', centeredSlides: true, spaceBetween: 20, loop: true });
      } catch (e) { console.error("Erro ao carregar:", e); }
    }
    carregar();
  </script>
</body>
</html>
