<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mural Rádio Cotia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { margin: 0; padding: 0; background: transparent; font-family: sans-serif; overflow: hidden; height: 100%; }
    
    .header-container {
      background: #001a33; color: #ffcc00; text-align: center; 
      padding: 6px 0; border-bottom: 2px solid #ffcc00;
    }
    .title { font-weight: bold; font-size: 14px; text-transform: uppercase; margin: 0; }
    .drag-info { font-size: 9px; color: #ffffff; margin-top: 1px; }

    /* Reduzi a altura total para 380px para garantir que caiba no SmallBio sem cortar */
    .swiper { width: 100%; height: 380px; padding-top: 5px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }

    .card { 
      position: relative; 
      width: 250px; 
      height: 340px; 
      border-radius: 12px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }

    img { width: 100%; height: 100%; object-fit: contain; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Botão de Som Amigável */
    .mute-btn {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255, 204, 0, 0.9); color: #001a33;
      border: none; padding: 5px 10px; border-radius: 20px;
      font-size: 10px; font-weight: bold; cursor: pointer; z-index: 20;
    }

    .btn-link { 
      position: absolute; bottom: 10px; right: 10px; 
      background: #ffcc00; color: #001a33; 
      padding: 6px 12px; border-radius: 6px; 
      font-size: 10px; font-weight: bold; text-decoration: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="title">Mural da Comunidade</div>
    <div class="drag-info">&lt; Arraste para os lados &gt;</div>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper" id="conteudo-mural"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const urlPlanilha = "https://script.google.com/macros/s/AKfycbFU7ONeMsoBqXiRT0GwIwPocYtyH21kItIerNFtbhtigSMFv150JKEj5ok3OKaaFX6Qg/exec";

    function toggleMute(btn, videoId) {
      const v = document.getElementById(videoId);
      v.muted = !v.muted;
      btn.innerText = v.muted ? "ATIVAR SOM 🔊" : "MUDO 🔇";
    }

    async function carregarMural() {
      try {
        const resposta = await fetch(urlPlanilha);
        const dados = await resposta.json();
        const container = document.getElementById("conteudo-mural");

        if (!dados || dados.length === 0) return;

        container.innerHTML = dados.map((item, index) => {
          const linkArquivo = item.arquivo || "";
          const ehVideo = linkArquivo.toLowerCase().includes('.mp4') || linkArquivo.toLowerCase().includes('.mov');
          const videoId = "vid-" + index;
          
          let midiaHtml = "";
          if (ehVideo) {
            midiaHtml = `
              <button class="mute-btn" onclick="toggleMute(this, '${videoId}')">ATIVAR SOM 🔊</button>
              <video id="${videoId}" src="${linkArquivo}" autoplay muted loop playsinline></video>
            `;
          } else {
            midiaHtml = `<img src="${linkArquivo}">`;
          }

          return `
            <div class="swiper-slide">
              <div class="card">
                ${midiaHtml}
                ${item.link ? `<a href="${item.link}" target="_blank" class="btn-link">Ver Mais</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', {
          slidesPerView: 'auto', centeredSlides: true, spaceBetween: 15, loop: dados.length > 1
        });
      } catch (e) { console.error(e); }
    }
    carregarMural();
  </script>
</body>
</html>
