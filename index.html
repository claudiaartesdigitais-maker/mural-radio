<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      background: #001a33; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      overflow-x: hidden;
    }

    /* Banner "Semana" (Puxado da Coluna E) */
    #banner-capa { 
      width: 100%; display: none; 
      padding: 15px 0 5px 0; 
      text-align: center;
    }
    #banner-capa img { width: 92%; max-width: 600px; height: auto; border-radius: 10px; }

    /* Swiper - Carrossel do Mural */
    .swiper { width: 100%; height: 440px; margin-top: 5px; background: #001a33; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { 
      width: 290px; 
      height: 380px; 
      background: #000; 
      border-radius: 15px; 
      overflow: hidden; 
      border: 1px solid #333; 
      position: relative; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }
    
    img, video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-link { 
      position: absolute; 
      bottom: 15px; 
      right: 15px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 900; 
      text-decoration: none; 
      font-size: 13px; 
      z-index: 10; 
    }

    @media (max-width: 600px) {
      .swiper { height: 390px; }
      .card { width: 265px; height: 350px; }
    }
  </style>
</head>
<body>

  <div id="banner-capa"></div>
  
  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Link NOVO da sua implantação
    const linkDaPlanilha = "https://script.google.com/macros/s/AKfycbxBDmfYsPqnJVhkwty3JoyKB_Al8xPHrk5yHsyuZFki2qkH9CJV3qCcMlvnwo-wYD0H4Q/exec";

    async function carregar() {
      try {
        const res = await fetch(linkDaPlanilha);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        // Puxa a capa da coluna E enviada pelo novo Script.gs
        if (dados[0].capa && dados[0].capa.length > 5) {
            const b = document.getElementById("banner-capa");
            b.innerHTML = `<img src="${dados[0].capa}">`;
            b.style.display = "block";
        }

        const container = document.getElementById("track");
        container.innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          return `
            <div class="swiper-slide">
              <div class="card">
                ${isVideo 
                  ? `<video src="${item.arquivo}" autoplay muted loop playsinline></video>` 
                  : `<img src="${item.arquivo}" loading="lazy">`}
                ${item.link && item.link.length > 5 ? `<a href="${item.link}" target="_blank" class="btn-link">VER MAIS</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', { 
          slidesPerView: 'auto', 
          centeredSlides: true, 
          spaceBetween: 20, 
          loop: dados.length > 1,
          grabCursor: true
        });
      } catch (e) { console.error("Erro ao carregar Mural:", e); }
    }
    carregar();
  </script>
</body>
</html>
