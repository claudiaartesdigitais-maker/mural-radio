<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Rádio Cotia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <style>
    body, html { margin: 0; padding: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
    
    .header-container {
      background: #001a33; 
      color: #ffcc00; 
      text-align: center; 
      padding: 8px 0;
      border-bottom: 3px solid #ffcc00;
    }

    .title { font-weight: bold; font-size: 16px; text-transform: uppercase; margin: 0; }
    .drag-info { font-size: 10px; color: #ffffff; margin-top: 2px; }

    /* Ajustamos a altura aqui para não cortar embaixo */
    .swiper { width: 100%; height: 410px; padding-top: 10px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }

    .card { 
      position: relative; 
      width: 260px; /* Um pouco mais estreito para caber melhor em telas pequenas */
      height: 360px; /* Altura controlada para não cortar */
      border-radius: 12px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }

    /* Ajuste para imagem não cortar */
    img { width: 100%; height: 100%; object-fit: contain; background: #000; }
    
    /* Ajuste para vídeo */
    video { width: 100%; height: 100%; object-fit: cover; }

    .btn-link { 
      position: absolute; 
      bottom: 10px; 
      right: 10px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-size: 10px; 
      font-weight: bold; 
      text-decoration: none;
      text-transform: uppercase;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="title">Mural da Comunidade</div>
    <div class="drag-info">&lt; Arraste e clique no vídeo para som &gt;</div>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper" id="conteudo-mural"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    const urlPlanilha = "https://script.google.com/macros/s/AKfycbFU7ONeMsoBqXiRT0GwIwPocYtyH21kItIerNFtbhtigSMFv150JKEj5ok3OKaaFX6Qg/exec";

    async function carregarMural() {
      try {
        const resposta = await fetch(urlPlanilha);
        const dados = await resposta.json();
        const container = document.getElementById("conteudo-mural");

        if (!dados || dados.length === 0) {
          container.innerHTML = '<p style="color:white; text-align:center; padding-top:50px;">Nenhum anúncio ativo.</p>';
          return;
        }

        container.innerHTML = dados.map(item => {
          const linkArquivo = item.arquivo || "";
          const ehVideo = linkArquivo.toLowerCase().includes('.mp4') || linkArquivo.toLowerCase().includes('.mov');
          
          // Adicionamos 'controls' para a pessoa clicar no play/áudio
          const midiaHtml = ehVideo 
            ? `<video src="${linkArquivo}" controls playsinline></video>` 
            : `<img src="${linkArquivo}" onerror="this.src='https://via.placeholder.com/260x360?text=Imagem+Indisponivel'">`;

          return `
            <div class="swiper-slide">
              <div class="card">
                ${midiaHtml}
                ${item.link ? `<a href="${item.link}" target="_blank" class="btn-link">Ver Mais</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', {
          slidesPerView: 'auto',
          centeredSlides: true,
          spaceBetween: 20,
          loop: dados.length > 1,
          grabCursor: true
        });

      } catch (erro) {
        console.error(erro);
      }
    }
    carregarMural();
  </script>
</body>
</html>
