<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Rádio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { margin: 0; padding: 0; background: transparent; font-family: sans-serif; overflow: hidden; }
    .header { background: #001a33; color: #ffcc00; text-align: center; padding: 5px; border-bottom: 2px solid #ffcc00; }
    .swiper { width: 100%; height: 360px; margin-top: 10px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    .card { width: 240px; height: 320px; border-radius: 10px; overflow: hidden; background: #000; position: relative; border: 1px solid #333; }
    img, video { width: 100%; height: 100%; object-fit: contain; }
    .btn { position: absolute; bottom: 10px; right: 10px; background: #ffcc00; color: #001a33; padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; text-decoration: none; z-index: 10; }
  </style>
</head>
<body>
  <div class="header"><b style="font-size:14px;">MURAL DA COMUNIDADE</b></div>
  <div class="swiper"><div class="swiper-wrapper" id="lista"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const url = "https://script.google.com/macros/s/AKfycbFU7ONeMsoBqXiRT0GwIwPocYtyH21kItIerNFtbhtigSMFv150JKEj5ok3OKaaFX6Qg/exec";

    fetch(url)
      .then(res => res.json())
      .then(dados => {
        const lista = document.getElementById("lista");
        if (!dados || dados.length === 0) return;

        lista.innerHTML = dados.map(item => {
          const ehVideo = item.arquivo.toLowerCase().includes('.mp4');
          const midia = ehVideo 
            ? `<video src="${item.arquivo}" controls playsinline></video>` 
            : `<img src="${item.arquivo}">`;
          
          return `<div class="swiper-slide"><div class="card">${midia}${item.link ? `<a href="${item.link}" target="_blank" class="btn">VER MAIS</a>` : ''}</div></div>`;
        }).join('');

        new Swiper('.swiper', { slidesPerView: 'auto', centeredSlides: true, spaceBetween: 15, loop: dados.length > 1 });
      })
      .catch(e => console.log(e));
  </script>
</body>
</html>
