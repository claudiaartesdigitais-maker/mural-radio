<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      background: #001a33; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      overflow-x: hidden;
    }

    /* Banner "Semana" */
    #banner-capa { 
      width: 100%; display: none; 
      padding: 20px 0; 
      text-align: center;
    }
    #banner-capa img { width: 90%; max-width: 600px; height: auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

    .header { background: #001a33; color: #ffcc00; text-align: center; padding: 12px; border-bottom: 3px solid #ffcc00; }
    .title { font-weight: bold; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Swiper */
    .swiper { width: 100%; height: 420px; margin-top: 15px; background: #001a33; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    /* Card do Mural */
    .card { 
      width: 290px; 
      height: 380px; 
      background: #000; 
      border-radius: 15px; 
      overflow: hidden; 
      border: 1px solid #333; 
      position: relative; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }
    
    img, video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-link { 
      position: absolute; 
      bottom: 15px; 
      right: 15px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 900; 
      text-decoration: none; 
      font-size: 13px; 
      z-index: 10; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    @media (max-width: 600px) {
      .swiper { height: 380px; }
      .card { width: 260px; height: 340px; }
    }
  </style>
</head>
<body>

  <div id="banner-capa"></div>

  <div class="header"><div class="title">Mural da Comunidade</div></div>
  
  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Link da planilha do Mural
    const linkDaPlanilha = "https://script.google.com/macros/s/AKfycbxtWap7_DNttvDVHAxkf5rn_pn7a6zOcqBRKY_GgCzBoJa2iAbMl_ks6a2lcYsJHjwnLQ/exec";

    async function carregar() {
      try {
        const res = await fetch(linkDaPlanilha);
        const dados = await res.json();
        
        if (!dados || dados.length === 0) return;

        // Lógica da Capa (Busca na primeira linha da planilha)
        const itemCapa = dados.find(i => i.capa && i.capa.length > 10);
        if (itemCapa) {
            const b = document.getElementById("banner-capa");
            b.innerHTML = `<img src="${itemCapa.capa}">`;
            b.style.display = "block";
        }

        const container = document.getElementById("track");
        container.innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          const midia = isVideo 
            ? `<video src="${item.arquivo}" autoplay muted loop playsinline></video>` 
            : `<img src="${item.arquivo}" loading="lazy">`;
          
          return `
            <div class="swiper-slide">
              <div class="card">
                ${midia}
                ${item.link && item.link.length > 5 ? `<a href="${item.link}" target="_blank" class="btn-link">VER MAIS</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', { 
          slidesPerView: 'auto', 
          centeredSlides: true, 
          spaceBetween: 20, 
          loop: dados.length > 1,
          grabCursor: true
        });
      } catch (e) { 
        console.error("Erro no Mural:", e); 
      }
    }
    carregar();
  </script>
</body>
</html>
